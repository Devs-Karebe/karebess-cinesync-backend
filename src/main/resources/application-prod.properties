# Production Environment Configuration

# Database Configuration - PostgreSQL
# These values should be externalized via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinesync_prod}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Server Configuration
server.port=8080
server.servlet.context-path=/devs-karebe/api/v1

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.karebes.movies.backend=INFO

# DevTools - Disabled in production
spring.devtools.restart.enabled=false
